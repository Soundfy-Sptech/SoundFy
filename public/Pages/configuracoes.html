<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="configuracoes.title">SoundFy Intelligence — Configurações</title>
    <link rel="stylesheet" href="../Style/style.css">
</head>
<body>
    <aside class="barra-lateral">
        <a class="logo" href="index.html">
            <b>S</b>
            <span>Sound<span>Fy</span><small>INTELLIGENCE</small></span>
        </a>

        <div class="espaco-trabalho">
            <b>ST</b>
            <div>
                <strong>SoundFy Studio</strong>
                <small data-i18n="workspace.professional"></small>
            </div>
        </div>

        <nav>
            <label data-i18n="navigation.overview"></label>
            <a href="index.html"><span data-i18n="navigation.dashboard"></span></a>
            <a href="index.html#tendencias"><span data-i18n="navigation.trends"></span></a>
            <a href="index.html#generos"><span data-i18n="navigation.genres"></span></a>
            <a href="index.html#regioes"><span data-i18n="navigation.regions"></span></a>

            <label data-i18n="navigation.producer"></label>
            <a href="agenda.html"><span data-i18n="navigation.schedule"></span></a>

            <label data-i18n="navigation.analysis"></label>
            <a href="index.html#relatorios"><span data-i18n="navigation.reports"></span></a>
            <a href="index.html#insights"><span data-i18n="navigation.insights"></span></a>
        </nav>

        <div class="rodape-lateral">
            <a class="ativo" href="configuracoes.html">⚙ <span data-i18n="navigation.settings"></span></a>

            <div class="perfil">
                <b>FL</b>
                <div>
                    <strong>Felipe Leone</strong>
                    <small data-i18n="profile.producer"></small>
                </div>
            </div>
        </div>
    </aside>

    <main>
        <header>
            <button id="menu" class="menu-mobile">☰</button>

            <div class="trilha">
                <span data-i18n="workspace.name"></span>
                <b>/</b>
                <strong data-i18n="navigation.settings"></strong>
            </div>

            <div class="logo-mobile">
                Sound<span>Fy</span>
            </div>

            <div class="acoes">
                <b class="avatar-topo">FL</b>
            </div>
        </header>

        <section class="introducao">
            <div>
                <p data-i18n="configuracoes.workspaceLabel"></p>
                <h1 data-i18n="configuracoes.heading"></h1>
                <span data-i18n="configuracoes.description"></span>
            </div>
        </section>

        <section class="layout-configuracoes">
            <nav class="nav-configuracoes">
                <a class="ativo" href="#espaco-trabalho" data-i18n="configuracoes.workspaceTab"></a>
                <a href="#aparencia" data-i18n="configuracoes.appearanceTab"></a>
                <a href="#dados" data-i18n="configuracoes.dataTab"></a>
                <a href="#notificacoes" data-i18n="configuracoes.notificationsTab"></a>
            </nav>

            <div class="conteudo-configuracoes">
                <article class="painel cartao-configuracoes" id="espaco-trabalho">
                    <div class="painel-cabecalho">
                        <div>
                            <p data-i18n="configuracoes.workspaceLabel"></p>
                            <h2 data-i18n="configuracoes.generalInfo"></h2>
                            <span data-i18n="configuracoes.generalInfoDescription"></span>
                        </div>
                    </div>

                    <div class="formulario">
                        <label>
                            <span data-i18n="configuracoes.workspaceName"></span>
                            <input value="SoundFy Studio">
                        </label>

                        <label>
                            <span data-i18n="configuracoes.responsible"></span>
                            <input value="Felipe Leone">
                        </label>

                        <label class="completo">
                            <span data-i18n="configuracoes.descriptionLabel"></span>
                            <textarea data-i18n-placeholder="configuracoes.workspaceDescription">Plataforma de inteligência para análise de tendências e oportunidades do mercado musical.</textarea>
                        </label>
                    </div>

                    <div class="salvar">
                        <button class="contorno" data-i18n="common.cancel"></button>
                        <button class="primario" data-i18n="configuracoes.saveChanges"></button>
                    </div>
                </article>

                <article class="painel cartao-configuracoes" id="aparencia">
                    <div class="painel-cabecalho">
                        <div>
                            <p data-i18n="configuracoes.interfaceLabel"></p>
                            <h2 data-i18n="configuracoes.appearance"></h2>
                            <span data-i18n="configuracoes.appearanceDescription"></span>
                        </div>
                    </div>

                    <div class="opcoes-tema">
                        <button class="escolha-tema" data-theme-choice="dark">
                            <i class="previa previa-escura"></i>
                            <strong data-i18n="configuracoes.dark"></strong>
                            <small data-i18n="configuracoes.darkDescription"></small>
                        </button>

                        <button class="escolha-tema" data-theme-choice="light">
                            <i class="previa previa-clara"></i>
                            <strong data-i18n="configuracoes.light"></strong>
                            <small data-i18n="configuracoes.lightDescription"></small>
                        </button>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.language"></strong>
                            <small data-i18n="configuracoes.languageDescription"></small>
                        </div>

                        <select id="language">
                            <option value="pt" data-i18n="configuracoes.portuguese"></option>
                            <option value="en" data-i18n="configuracoes.english"></option>
                            <option value="es" data-i18n="configuracoes.spanish"></option>
                        </select>
                    </div>
                </article>

                <article class="painel cartao-configuracoes" id="dados">
                    <div class="painel-cabecalho">
                        <div>
                            <p data-i18n="configuracoes.dataLabel"></p>
                            <h2 data-i18n="configuracoes.dataSources"></h2>
                        </div>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.audioConsumption"></strong>
                            <small data-i18n="configuracoes.audioConsumptionDescription"></small>
                        </div>
                        <em data-i18n="configuracoes.active"></em>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.searches"></strong>
                            <small data-i18n="configuracoes.searchesDescription"></small>
                        </div>
                        <em data-i18n="configuracoes.active"></em>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.interactions"></strong>
                            <small data-i18n="configuracoes.interactionsDescription"></small>
                        </div>
                        <em data-i18n="configuracoes.active"></em>
                    </div>
                </article>

                <article class="painel cartao-configuracoes" id="notificacoes">
                    <div class="painel-cabecalho">
                        <div>
                            <p data-i18n="configuracoes.alertsLabel"></p>
                            <h2 data-i18n="configuracoes.notifications"></h2>
                        </div>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.newOpportunities"></strong>
                            <small data-i18n="configuracoes.newOpportunitiesDescription"></small>
                        </div>

                        <label class="alternador">
                            <input type="checkbox" checked>
                            <i></i>
                        </label>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.completedReports"></strong>
                            <small data-i18n="configuracoes.completedReportsDescription"></small>
                        </div>

                        <label class="alternador">
                            <input type="checkbox" checked>
                            <i></i>
                        </label>
                    </div>
                </article>
            </div>
        </section>
    </main>

   <script src="../JS/i18n.js"></script>
<script src="../JS/translate.js"></script>
<script>
    let language = document.querySelector("#language")

    language.value = localStorage.getItem("soundfy-language") || "pt"

    language.addEventListener("change", function () {
        changeLanguage(this.value)
    })
</script>
<script src="../JS/script.js"></script>
</body>
</html>
