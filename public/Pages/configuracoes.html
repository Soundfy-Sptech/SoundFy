<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="configuracoes.title">SoundFy Intelligence — Configurações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="../Style/style.css">
</head>
<body>
    <aside class="barra-lateral" id="barra-lateral"></aside>
    <script src="../JS/sidebar.js"></script>

    <main>
        <header>
            <button id="menu" class="menu-mobile">☰</button>

            <div class="trilha">
                <span data-i18n="configuracoes.settingsLabel">PREFERÊNCIAS</span>
                <b>/</b>
                <strong data-i18n="navigation.settings"></strong>
            </div>

            <div class="logo-mobile">
                Sound<span>Fy</span>
            </div>

         <div class="acoes">
    <button class="sino">♢<i></i></button>

    <div class="menu-perfil-container">
        <button
            class="avatar-topo"
            id="perfil-menu-botao"
            aria-label="Abrir menu do perfil"
            aria-expanded="false"
            aria-controls="perfil-menu"
        >
            <b data-user-initials>U</b>
        </button>

        <div class="menu-perfil" id="perfil-menu" hidden>
            <div class="menu-perfil-info">
                <strong data-user-name>Usuário</strong>
                <small data-user-role>Usuário</small>
            </div>

            <a href="configuracoes.html" data-i18n="navigation.settings">
                Configurações
            </a>

            <button type="button" id="perfil-sair" data-i18n="profile.logout">
                Sair
            </button>
        </div>
    </div>
</div>
        </header>

        <section class="introducao">
            <div>
                <p data-i18n="configuracoes.settingsLabel">PREFERÊNCIAS</p>
                <h1 data-i18n="configuracoes.heading"></h1>
                <span data-i18n="configuracoes.description"></span>
            </div>
        </section>

        <section class="layout-configuracoes">
            <nav class="nav-configuracoes">
    <a class="ativo" href="#conta">Minha conta</a>
                <a href="#aparencia" data-i18n="configuracoes.appearanceTab"></a>
                <a href="#dados" data-i18n="configuracoes.dataTab"></a>
                <a href="#notificacoes" data-i18n="configuracoes.notificationsTab"></a>
            </nav>

            <div class="conteudo-configuracoes">

<article class="painel cartao-configuracoes" id="conta">
    <div class="painel-cabecalho">
        <div>
            <p>PERFIL PESSOAL</p>
            <h2>Minha conta</h2>
            <span>Gerencie seus dados pessoais e sua segurança.</span>
        </div>
    </div>

    <form id="form-conta" class="formulario">
        <label class="completo">
            Nome
            <input
                id="conta-nome"
                type="text"
                maxlength="50"
                required
            >
        </label>

        <label>
            E-mail
            <input
                id="conta-email"
                type="email"
                maxlength="50"
                required
            >
        </label>

        <label>
            Telefone
            <input
                id="conta-telefone"
                type="tel"
                maxlength="12"
            >
        </label>

        <label class="completo">
            Tipo de usuário
            <input id="conta-tipo" type="text" disabled>
        </label>

        <p id="conta-status" class="completo" role="status"></p>

        <div class="salvar completo">
            <button class="primario" type="submit">
                Salvar alterações
            </button>
        </div>
    </form>

    <div style="border-top:1px solid var(--borda); margin-top:24px; padding-top:20px;">
        <h3>Alterar senha</h3>

        <form id="form-senha" class="formulario">
            <label>
                Senha atual
                <input
                    id="senha-atual"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <label>
                Nova senha
                <input
                    id="senha-nova"
                    type="password"
                    minlength="8"
                    maxlength="72"
                    autocomplete="new-password"
                    required
                >
            </label>

            <p id="senha-status" class="completo" role="status"></p>

            <div class="salvar completo">
                <button class="primario" type="submit">
                    Alterar senha
                </button>
            </div>
        </form>
    </div>

    <div style="border-top:1px solid var(--borda); margin-top:24px; padding-top:20px;">
        <h3>Excluir minha conta</h3>
        <p>Essa ação é permanente e excluirá suas notificações vinculadas.</p>

        <form id="form-excluir-conta" class="formulario">
            <label class="completo">
                Confirme sua senha
                <input
                    id="excluir-senha"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <p id="excluir-status" class="completo" role="status"></p>

            <div class="salvar completo">
                <button class="botao-excluir" type="submit">
                    Excluir minha conta
                </button>
            </div>
        </form>
    </div>
</article>

                <article class="painel cartao-configuracoes" id="aparencia">
                    <div class="painel-cabecalho">
                        <div>
                            <p data-i18n="configuracoes.interfaceLabel"></p>
                            <h2 data-i18n="configuracoes.appearance"></h2>
                            <span data-i18n="configuracoes.appearanceDescription"></span>
                        </div>
                    </div>

                    <div class="opcoes-tema">
                        <button class="escolha-tema" data-theme-choice="dark">
                            <i class="previa previa-escura"></i>
                            <strong data-i18n="configuracoes.dark"></strong>
                            <small data-i18n="configuracoes.darkDescription"></small>
                        </button>

                        <button class="escolha-tema" data-theme-choice="light">
                            <i class="previa previa-clara"></i>
                            <strong data-i18n="configuracoes.light"></strong>
                            <small data-i18n="configuracoes.lightDescription"></small>
                        </button>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.language"></strong>
                            <small data-i18n="configuracoes.languageDescription"></small>
                        </div>

                        <select id="language" class="idioma-select">
                            <option value="pt" data-i18n="configuracoes.portuguese"></option>
                            <option value="en" data-i18n="configuracoes.english"></option>
                            <option value="es" data-i18n="configuracoes.spanish"></option>
                        </select>
                    </div>
                </article>

                <article class="painel cartao-configuracoes" id="dados">
                    <div class="painel-cabecalho">
                        <div>
                            <p data-i18n="configuracoes.dataLabel"></p>
                            <h2 data-i18n="configuracoes.dataSources"></h2>
                        </div>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.audioConsumption"></strong>
                            <small data-i18n="configuracoes.audioConsumptionDescription"></small>
                        </div>
                        <em data-i18n="configuracoes.active"></em>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.searches"></strong>
                            <small data-i18n="configuracoes.searchesDescription"></small>
                        </div>
                        <em data-i18n="configuracoes.active"></em>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.interactions"></strong>
                            <small data-i18n="configuracoes.interactionsDescription"></small>
                        </div>
                        <em data-i18n="configuracoes.active"></em>
                    </div>
                </article>

                <article class="painel cartao-configuracoes" id="notificacoes">
                    <div class="painel-cabecalho">
                        <div>
                            <p data-i18n="configuracoes.alertsLabel"></p>
                            <h2 data-i18n="configuracoes.notifications"></h2>
                        </div>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.newOpportunities"></strong>
                            <small data-i18n="configuracoes.newOpportunitiesDescription"></small>
                        </div>

                        <label class="alternador">
                            <input type="checkbox" checked>
                            <i></i>
                        </label>
                    </div>

                    <div class="configuracao">
                        <div>
                            <strong data-i18n="configuracoes.completedReports"></strong>
                            <small data-i18n="configuracoes.completedReportsDescription"></small>
                        </div>

                        <label class="alternador">
                            <input type="checkbox" checked>
                            <i></i>
                        </label>
                    </div>
                </article>
            </div>
        </section>
    </main>

   <script src="../JS/i18n.js"></script>
<script src="../JS/translate.js"></script>

<script>
    const seletorIdioma = document.querySelector("#language");

    seletorIdioma.value = localStorage.getItem("soundfy-language") || "pt";

    seletorIdioma.addEventListener("change", async function () {
        try {
            await changeLanguage(this.value);
        } catch (erro) {
            console.error("Erro ao trocar idioma:", erro);
        }
    });
</script>



<script src="../JS/script.js"></script>
<script src="../JS/sessao.js"></script>
<script src="../JS/menu-perfil.js"></script>
<script src="../JS/conta.js"></script>
</body>
</html>
