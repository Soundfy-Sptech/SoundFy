<script>
    (function () {
        // ---------- Idioma ----------
        // A preferência fica em localStorage ("soundfy-language"), gerenciada por JS/i18n.js.
        const seletorIdioma = document.querySelector("#language");

        seletorIdioma.value = localStorage.getItem("soundfy-language") || "pt";

        seletorIdioma.addEventListener("change", async function () {
            try {
                await changeLanguage(this.value);
            } catch (erro) {
                console.error("Erro ao trocar idioma:", erro);
            }
        });

        // Mantém o seletor igual ao idioma realmente aplicado (ex.: ao voltar pelo histórico).
        onLanguageReady(function () {
            seletorIdioma.value = window.currentLanguage();
        });

        // ---------- Navegação lateral das configurações ----------
        // O destaque (.ativo) sempre acompanha a seção ativa: clique, rolagem ou #hash.
        const links = Array.from(document.querySelectorAll(".nav-configuracoes a[href^='#']"));
        const itens = links
            .map(function (link) {
                return { link: link, secao: document.getElementById(link.getAttribute("href").slice(1)) };
            })
            .filter(function (item) {
                return item.secao;
            });

        if (!itens.length) {
            return;
        }

        const reduzirMovimento = window.matchMedia("(prefers-reduced-motion: reduce)");
        const margemTopo = 120;
        let cliqueEmAndamento = false;
        let temporizador = null;
        let agendado = false;

        function ativar(item) {
            itens.forEach(function (outro) {
                const ativo = outro === item;

                outro.link.classList.toggle("ativo", ativo);

                if (ativo) {
                    outro.link.setAttribute("aria-current", "true");
                } else {
                    outro.link.removeAttribute("aria-current");
                }
            });
        }

        function itemDaRolagem() {
            const rolagem = window.scrollY || document.documentElement.scrollTop;
            const altura = document.documentElement.scrollHeight;
            const noFim = rolagem > 0 && window.innerHeight + rolagem >= altura - 2;

            if (noFim) {
                return itens[itens.length - 1];
            }

            let atual = itens[0];

            itens.forEach(function (item) {
                if (item.secao.getBoundingClientRect().top <= margemTopo) {
                    atual = item;
                }
            });

            return atual;
        }

        function liberarCliqueDepois(ms) {
            clearTimeout(temporizador);

            temporizador = setTimeout(function () {
                cliqueEmAndamento = false;
            }, ms);
        }

        itens.forEach(function (item) {
            item.link.addEventListener("click", function (evento) {
                evento.preventDefault();

                cliqueEmAndamento = true;
                ativar(item);

                item.secao.scrollIntoView({
                    behavior: reduzirMovimento.matches ? "auto" : "smooth",
                    block: "start"
                });

                history.replaceState(null, "", "#" + item.secao.id);
                liberarCliqueDepois(200);
            });
        });

        window.addEventListener("scroll", function () {
            // Durante a rolagem animada do clique, mantém o item clicado.
            if (cliqueEmAndamento) {
                liberarCliqueDepois(150);
                return;
            }

            if (agendado) {
                return;
            }

            agendado = true;

            requestAnimationFrame(function () {
                agendado = false;
                ativar(itemDaRolagem());
            });
        }, { passive: true });

        window.addEventListener("hashchange", function () {
            const alvo = itens.find(function (item) {
                return "#" + item.secao.id === location.hash;
            });

            if (alvo) {
                ativar(alvo);
            }
        });

        const inicial = itens.find(function (item) {
            return "#" + item.secao.id === location.hash;
        });

        ativar(inicial || itemDaRolagem());
    })();
</script>
