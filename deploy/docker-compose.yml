services:
  db:
    image: viniciusmenezes7/soundfy-db:1.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - soundfy-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: viniciusmenezes7/soundfy-app:1.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AMBIENTE_PROCESSO: producao
      DB_HOST: db
      DB_DATABASE: Soundfy
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 3306
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      ACCOUNT_TOKEN_SECRET: ${ACCOUNT_TOKEN_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  soundfy-dados:
